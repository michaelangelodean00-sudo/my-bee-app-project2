    <!-- ═══════════════════════════════════════════════════════════════════
         SECURITY HARDENING — Industry Best Practice Headers
         ═══════════════════════════════════════════════════════════════════ -->

    <!-- Prevent MIME-type sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Strict referrer policy — no leaking of URLs to third parties -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Clickjacking / framing protection is set via real HTTP header in .htaccess -->
    <!-- X-Frame-Options meta tag removed: it blocks the Lovable preview iframe and is not honored as a meta tag by browsers anyway -->

    <!-- Content Security Policy — restricts resource loading origins -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https: http:;
      media-src 'self' blob: https:;
      connect-src 'self' https: wss:;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- Permissions Policy — restrict sensitive browser APIs -->
    <meta http-equiv="Permissions-Policy" content="
      camera=(),
      microphone=(),
      geolocation=(),
      payment=(),
      usb=(),
      interest-cohort=()
    " />

    <!-- Cross-Origin policies -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
    <meta http-equiv="Cross-Origin-Resource-Policy" content="same-site" />
    
    <!-- PWA & Mobile App Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="B.E.E App" />
    <meta name="application-name" content="B.E.E App" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Critical Resource Hints — earliest possible DNS + connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://i.pravatar.cc" />
    
    <!-- Preload Critical Assets (fetchpriority=high for LCP) -->
    <link rel="preload" href="/__l5e/assets-v1/2f5c2a9f-0d88-4a5c-84f1-b8a8d747a7f0/bee-app-bahamas-logo.png" as="image" type="image/png" fetchpriority="high" />
    <!-- Preload first ad image for instant splash render — match exact URL used in AdSplash -->
    <link rel="preload" href="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=1200&h=675&q=75&fm=webp&fit=crop" as="image" type="image/webp" fetchpriority="high" />

    <!-- Fonts: ONE combined request — 4x fewer round-trips, non-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />

    <!-- Inline Critical CSS: zero-flash first paint -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;line-height:1.5;scroll-behavior:smooth}
      body{font-family:'DM Sans',Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#fafafa;color:#111}
      #root{min-height:100vh;display:flex;flex-direction:column}
      /* Instant loading spinner */
      .initial-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fafafa;z-index:9999;will-change:opacity}
      .loader-spinner{width:48px;height:48px;border:3px solid #e5e7eb;border-top-color:#FFD500;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Prevent layout shift */
      img{max-width:100%;height:auto;display:block}
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Initial loading state before React hydrates -->
      <div class="initial-loader" id="initial-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>

    <!-- Remove initial loader at the earliest possible moment -->
    <script>
      (function() {
        var removed = false;
        function removeLoader() {
          if (removed) return;
          removed = true;
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.15s ease';
            setTimeout(function() {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 150);
          }
        }
        // Remove as soon as DOM is ready
        if (document.readyState !== 'loading') {
          removeLoader();
        } else {
          document.addEventListener('DOMContentLoaded', removeLoader, { once: true });
        }
        // Hard fallback at 500ms — never leave user stuck
        setTimeout(removeLoader, 500);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
