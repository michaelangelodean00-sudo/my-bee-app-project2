    <!-- Inline Critical CSS: zero-flash first paint -->
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;line-height:1.5;scroll-behavior:smooth}
      body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#fafafa;color:#111}
      #root{min-height:100vh;display:flex;flex-direction:column}
      /* Instant loading spinner */
      .initial-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fafafa;z-index:9999;will-change:opacity}
      .loader-spinner{width:48px;height:48px;border:3px solid #e5e7eb;border-top-color:#FFD500;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Prevent layout shift */
      img{max-width:100%;height:auto;display:block}
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Initial loading state before React hydrates -->
      <div class="initial-loader" id="initial-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>

    <!-- Remove initial loader at the earliest possible moment -->
    <script>
      (function() {
        var removed = false;
        function removeLoader() {
          if (removed) return;
          removed = true;
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.15s ease';
            setTimeout(function() {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 150);
          }
        }
        // Remove as soon as DOM is ready
        if (document.readyState !== 'loading') {
          removeLoader();
        } else {
          document.addEventListener('DOMContentLoaded', removeLoader, { once: true });
        }
        // Hard fallback at 500ms — never leave user stuck
        setTimeout(removeLoader, 500);
      })();
    </script>
