    <!-- Inline Critical CSS for faster FCP -->
    <style>
      /* Critical CSS for initial render */
      *{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;line-height:1.5}
      body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh}
      /* Loading state styles */
      .initial-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fafafa;z-index:9999}
      .dark .initial-loader{background:#0a0a14}
      .loader-spinner{width:48px;height:48px;border:3px solid #e5e7eb;border-top-color:#ffd500;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Initial loading state before React hydrates -->
      <div class="initial-loader" id="initial-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <!-- Remove initial loader as soon as possible -->
    <script>
      (function() {
        var removed = false;
        function removeLoader() {
          if (removed) return;
          var loader = document.getElementById('initial-loader');
          if (loader) {
            removed = true;
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.1s ease';
            setTimeout(function() { loader.remove(); }, 100);
          }
        }
        // Remove immediately or very quickly
        if (document.readyState !== 'loading') {
          removeLoader();
        } else {
          document.addEventListener('DOMContentLoaded', removeLoader);
        }
        // Fallback: always remove after 300ms max
        setTimeout(removeLoader, 300);
      })();
    </script>
